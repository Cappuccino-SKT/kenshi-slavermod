; SlaverMod - player-owned slaves for Kenshi (RE_Kenshi plugin).
; Read when the game starts. With ModConfigMenu (MCM) active, everything here can also be
; changed in game, in Options > MCM > SlaverMod, without restarting.
;
; Traduzido para portugues do Brasil: use Language=pt (ou Opcoes > MCM > SlaverMod > Idioma).

[SlaverMod]

; Language of the mod's messages: en = English, pt = Brazilian Portuguese (portugues do Brasil).
Language=en

; Squad new slaves are put in (created if missing).
SquadName=Slaves

; 1 - shows Enslave / Free in the order menu (select one of your members and hold the
; right mouse button over the target). The selected member becomes the slave's owner.
ContextMenu=1

; 1 - also shows the ENSLAVE / FREE button in the inventory window.
ShowButton=0

; 1 - enslave/free at once, without the owner walking to the target.
InstantAction=0

; Time the owner spends next to the target putting on or taking off the shackles.
ActionSeconds=4

; Time for the owner to reach the target before giving up.
ApproachTimeout=120

; How close the owner must get (multiple of both characters' size).
ReachFactor=2.5

; 1 - slaves get locked shackles; freeing removes them.
GiveShackles=1

; Shackles item used (game ID), and the alternative when the first does not fit (e.g. hivers).
ShackleItem=SHACKLES
ShackleItemAlt=SHACKLES-BODY

; Owner's animation while acting (the first-aid one). Empty = no animation.
ActionAnimation=medic

; 1 - shows the progress bar over the owner while acting.
ProgressBar=1

; How much the relation with the victim's faction drops when enslaving (0 = none; relations go from -100 to 100).
RelationLoss=5

; How much the relation with the original faction rises when a slave is freed. Must be lower
; than RelationLoss (otherwise half of RelationLoss is used).
; Each slave's origin is kept in SlaverMod_origins.ini in this folder.
RelationGain=2

; ---- New slaves ----
; 1 - a new slave follows whoever enslaved them. After that, their work is up to you,
; with the game's normal orders.
SlaveEscort=1
; bodyguard = follow and guard; follow = follow only.
EscortMode=bodyguard
; 1 - removes the chains of whoever was chained when enslaved.
UnchainOnEnslave=1

; 1 - turns on the game's native "slave work" behaviour (the one used on slave farms).
; Experimental: it may get in the way of your orders.
SlaveAIJob=0

; 1 - slaves cannot use weapons: any equipped weapon is dropped.
BanWeapons=1

; ---- Rebellion ----
; Every RebellionDays in-game days both sides are weighed:
;   free   = number of free members x highest strength among them
;   slaves = number of slaves       x highest strength among them
; If the slaves are stronger, the rebellion chance is
;   (slaves - free) / slaves x RebellionChanceMult   (at most RebellionMaxChance)
; On a rebellion, slaves with strength >= RebelMinStrength join RebelFaction,
; lose their shackles and get a poor weapon (RebelWeapon).
RebellionEnabled=1
RebellionDays=7
RebellionChanceMult=1.0
RebellionMaxChance=0.9
RebelMinStrength=20

; Rebel faction (default: Anti-Slavers).
RebelFaction=58229-Dialogue.mod

; Rebel weapon (default: Iron Club, the one Hungry Bandits use), its manufacturer
; (default: "Unknown", the bandits' generic one) and quality model
; (default: "Rusted Junk", the worst; empty = the game picks one of the manufacturer's models).
RebelWeapon=52295-rebirth.mod
RebelWeaponMaker=912-gamedata.base
RebelWeaponModel=913-gamedata.base

; 1 - the Anti-Slavers go to war with you on a rebellion (so the rebels fight). Permanent.
RebellionHostile=1

; How far rebels chase your free members to attack them.
RebelChaseRange=1000

; ---- Debug ----
; 1 - turns on the test hotkeys below (EnslaveKey and RebellionTestKey). With 0 they do nothing.
DebugMode=0

; Hotkey that enslaves/frees the selected character. Debug mode only.
; Formats: K, CTRL+K, SHIFT+ALT+K, F9...
EnslaveKey=CTRL+K

; Test hotkey: runs the rebellion check right away. Debug mode only.
RebellionTestKey=CTRL+SHIFT+R
; 1 - the test hotkey always causes a rebellion (ignores the chance). Set back to 0 after testing.
RebellionTestForce=0

; 1 - writes details to SlaverMod_trace.log (in this folder) and RE_Kenshi_log.txt.
Debug=0
