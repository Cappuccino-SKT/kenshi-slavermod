; SlaverMod - player-owned slaves for Kenshi (RE_Kenshi plugin).
; Read when the game starts. With ModConfigMenu (MCM) active, everything here can also be
; changed in game, in Options > MCM > SlaverMod, without restarting.
;
; Traduzido para portugues do Brasil: use Language=pt (ou Opcoes > MCM > SlaverMod > Idioma).

[SlaverMod]

; Language of the mod's messages: en = English, pt = Brazilian Portuguese (portugues do Brasil).
Language=en

; 1 - the mod is active.
; 0 - the mod leaves every character alone: no menu options, submission, escapes, rebellions or
;     protection. Your own characters enslaved by another faction (e.g. the Rebirth start) are
;     already left to the game, so this is only a manual switch in case something still gets in the way.
Enabled=1

; Squad new slaves are put in (created if missing).
SquadName=Slaves

; 1 - shows Enslave / Free in the order menu (select one of your members and hold the
; right mouse button over the target). The selected member becomes the slave's owner.
ContextMenu=1

; 1 - also shows the ENSLAVE / FREE button in the inventory window.
ShowButton=0

; 1 - enslave/free at once, without the owner walking to the target.
InstantAction=0

; Time the owner spends next to the target putting on or taking off the shackles.
ActionSeconds=4

; Time for the owner to reach the target before giving up.
ApproachTimeout=120

; How close the owner must get (multiple of both characters' size).
ReachFactor=2.5

; 1 - slaves get locked shackles; freeing removes them.
GiveShackles=1

; Shackles item used (game ID), and the alternative when the first does not fit (e.g. hivers).
ShackleItem=SHACKLES
ShackleItemAlt=SHACKLES-BODY

; Owner's animation while acting (the first-aid one). Empty = no animation.
ActionAnimation=medic

; 1 - shows the progress bar over the owner while acting.
ProgressBar=1

; 1 - shows messages at the top of the screen (enslaved, freed, rebellion check...).
; 0 - hides them. The REBELLION alert is always shown.
ShowNotices=1

; How much the relation with the victim's faction drops when enslaving (0 = none; relations go from -100 to 100).
RelationLoss=5

; How much the relation with the original faction rises when a slave is freed. Must be lower
; than RelationLoss (otherwise half of RelationLoss is used).
; Each slave's origin is kept in SlaverMod_origins.ini in this folder.
RelationGain=2

; ---- New slaves ----
; 1 - a new slave follows whoever enslaved them. After that, their work is up to you,
; with the game's normal orders.
SlaveEscort=1
; bodyguard = follow and guard; follow = follow only.
EscortMode=bodyguard
; 1 - removes the chains of whoever was chained when enslaved.
UnchainOnEnslave=1

; 1 - turns on the game's native "slave work" behaviour (the one used on slave farms).
; Experimental: it may get in the way of your orders.
SlaveAIJob=0

; 1 - slaves cannot use weapons: any equipped weapon is dropped.
BanWeapons=1

; ---- Skeletons ----
; 1 - an unconscious skeleton (any robot race) is not enslaved: "Reprogram" rolls a chance
; on the performer's robotics. Success: a free member of your faction, in the performer's
; squad. Failure: the skeleton is destroyed.
SkeletonThrall=0
; Chance in % = ThrallBaseChance + ThrallChancePerLevel x robotics, at most ThrallMaxChance.
ThrallBaseChance=20
ThrallChancePerLevel=0.75
ThrallMaxChance=95

; ---- Submission ----
; Every slave has a submission from 0 to 100: 0-24 Defiant, 25-49 Restless,
; 50-74 Obedient, 75-100 Loyal. Saved with each save game (saves folder next to this file).
; 1 - shows a bar with the submission over the slave you select.
ShowSubmission=1
; Submission of a new slave, plus a bonus if they were caged or chained when enslaved.
SubmissionStart=30
SubmissionPrisonerBonus=10
; Watched slaves slowly get used to their condition: submission per in-game day,
; but time alone never takes it above SubmissionGainCap.
SubmissionDailyGain=2.0
SubmissionGainCap=60
; 1 - each race and subrace has its own starting submission and pace (table in
; SlaverMod_races.ini). SubmissionStart is then used only for races not in the table.
RaceTraits=1
; Freed slaves with this submission or more stay in your faction (they have come to see it as
; their own); the others go back to the faction they were taken from (EscapeFaction if unknown)
; and walk home. 0 = everyone stays, 101 = everyone leaves.
FreeStayMinSubmission=90
; Squad template whose AI the freed who leave get (default: "UC escaped slave", the same AI as runaways;
; "Lost Wanderer" 3330-gamedata.base left them standing).
FreedSquadTemplate=54294-rebirth.mod
; How they move away from your members until they are far enough, then head to a town:
; run_away, forced, total or hometown (game AI goals).
FreedGoal=forced

; ---- Supervision and escape ----
; 1 - a slave is watched when a free, awake member of your faction is within
; SupervisionRange (game units; a character is about 8 wide), or when caged.
; Watched slaves gain submission (above); unwatched ones lose SubmissionUnsupervisedLoss per day.
SupervisionEnabled=1
SupervisionRange=500
SubmissionUnsupervisedLoss=5.0

; 1 - slaves below EscapeMaxSubmission may run away. Chance per in-game day:
;   EscapeDailyChance x (1 - submission / EscapeMaxSubmission)
;   x EscapeSupervisedMult when watched, x EscapeShackledMult when wearing shackles.
; Caged, chained or unconscious slaves never run.
EscapeEnabled=1
EscapeMaxSubmission=50
EscapeDailyChance=0.5
EscapeSupervisedMult=0.1
EscapeShackledMult=0.5
; A runaway goes back to the faction they were taken from, or to EscapeFaction
; (default: Drifters) when that is unknown. They get out of the shackles and flee until your
; nearest member is EscapeSafeDistance away. Knock them out to enslave them again;
; a recaptured slave comes back with EscapeRecapturePenalty less submission.
EscapeFaction=51707-rebirth.mod
EscapeSafeDistance=1500
EscapeRecapturePenalty=10
; Runaways are forgotten this many game days after escaping (0 = never), and at once
; when they die. After that, capturing them counts as a new slave.
EscapeForgetDays=30
; 1 - runaways get the game's own "escaped slave" state (slavers may hunt them).
EscapeMarkEscaped=1
; 1 - runaways lose their shackles (0 = they run away wearing them).
EscapeRemoveShackles=1
; How runaways flee: forced, run_away, total or hometown (game AI goals; for testing).
EscapeGoal=forced
; Squad template whose AI runaways get (default: "UC escaped slave").
EscapeSquadTemplate=54294-rebirth.mod

; ---- Punishment and reward ----
; Options in the right-click menu over one of your slaves (besides Free). The owner walks
; over and does it, like enslaving.
; Punish: +PunishSubmission and PunishDamage (blunt) on a random limb. Each new punishment
; within PunishCooldownDays gives half, then a third... and hurts twice, three times as much.
PunishEnabled=1
PunishSubmission=15
PunishDamage=10
PunishCooldownDays=1.0
; Animations while punishing: the one doing it (empty = none) and the slave.
PunishAnimation=
PunishVictimAnimation=kneeling hostage idle
; When PunishAnimation is empty, the one punishing swings the weapon in hand: the first animation
; of each list that the character has (blades, heavy/blunt weapons and polearms, fists).
PunishAnimBlade=chop down static
PunishAnimHeavy=chop down static
PunishAnimUnarmed=chop down static
; Optional: the slave flinches at each swing instead of only kneeling (game hit reactions, one at
; random, e.g. mid blow light|back blow light|mid blow). Empty = the slave just kneels.
PunishHitAnimation=
; 1 - slavers and slaves say a line when enslaving, punishing, rewarding, freeing, trading,
; escaping and rebelling (lines in SlaverMod_lines.ini).
Speech=1
; Reward: +RewardSubmission for RewardCost cats, once per RewardCooldownDays per slave.
RewardEnabled=1
RewardSubmission=5
RewardCost=100
RewardCooldownDays=1.0
RewardAnimation=
; A slave in a cage gains CageDailyGain more per day, up to CageSubmissionCap.
CageDailyGain=10
CageSubmissionCap=75

; ---- Slave trade ----
; 1 - at slave traders, "I'm looking to buy slaves" / "I want to sell some slaves" open the
; SlaverMod window instead of the game's: buy the trader's slaves (they join your slave squad,
; shackled) or sell your slaves (they really leave for the trader's faction).
TradeWindow=1
; 1 - slavers of other factions leave your slaves alone (without it they walk up to "process"
; them as if they were theirs).
ProtectSlaves=1
; 1 - lets you enslave other factions' slaves (0: they are their owners' property; runaways
; and free people can still be enslaved).
AllowStealingSlaves=0
; 1 - traders no longer offer a fixed 400 cats for someone you carry: enslave them first and
; sell them in the window.
DisableCarriedSale=1
; Worth of a slave = TradeBaseValue + TradeStatValue x (strength + toughness + dexterity
;   + melee attack + melee defence + labouring) x race Value (SlaverMod_races.ini)
;   x (0.75 + submission / 200)      (Defiant 0 = 75%, 50 = 100%, Loyal 100 = 125%)
TradeBaseValue=300
TradeStatValue=12
; Buying costs worth x TradeBuyMult; selling pays worth x TradeSellMult.
TradeBuyMult=2.0
TradeSellMult=1.0
; Bought slaves are already broken in: they start at the race's submission + this.
TradeBoughtBonus=15
; How far from the trader slaves for sale are searched (game units).
TradeRadius=1500

; ---- Rebellion ----
; Every RebellionDays in-game days both sides are weighed:
;   free   = number of free members x highest strength among them
;   slaves = number of slaves       x highest strength among them
; If the slaves are stronger, the rebellion chance is
;   (slaves - free) / slaves x RebellionChanceMult   (at most RebellionMaxChance)
; On a rebellion, slaves with strength >= RebelMinStrength join RebelFaction,
; lose their shackles and get a poor weapon (RebelWeapon).
RebellionEnabled=1
RebellionDays=7
RebellionChanceMult=1.0
RebellionMaxChance=0.9
; Strength a defiant slave needs to rebel. It depends on submission: RebelMinStrengthDefiant
; at submission 0, growing up to RebelMinStrength just below RebelMaxSubmission.
RebelMinStrength=20
RebelMinStrengthDefiant=10
; Slaves with this submission or more never rebel nor count for the rebellion.
RebelMaxSubmission=50

; Rebel faction (default: Anti-Slavers).
RebelFaction=58229-Dialogue.mod

; Rebel weapon (default: Iron Club, the one Hungry Bandits use), its manufacturer
; (default: "Unknown", the bandits' generic one) and quality model
; (default: "Rusted Junk", the worst; empty = the game picks one of the manufacturer's models).
RebelWeapon=52295-rebirth.mod
RebelWeaponMaker=912-gamedata.base
RebelWeaponModel=913-gamedata.base

; 1 - the Anti-Slavers go to war with you on a rebellion (so the rebels fight). Permanent.
RebellionHostile=1

; How far rebels chase your free members to attack them.
RebelChaseRange=1000

; ---- Debug ----
; 1 - turns on the test hotkeys below (EnslaveKey and RebellionTestKey). With 0 they do nothing.
DebugMode=0

; Hotkey that enslaves/frees the selected character. Debug mode only.
; Formats: K, CTRL+K, SHIFT+ALT+K, F9...
EnslaveKey=CTRL+K

; Test hotkey: runs the rebellion check right away. Debug mode only.
RebellionTestKey=CTRL+SHIFT+R
; 1 - the test hotkey always causes a rebellion (ignores the chance). Set back to 0 after testing.
RebellionTestForce=0

; Test key: +25 submission on the selected slave (back to 0 after 100). Debug mode only.
SubmissionTestKey=CTRL+SHIFT+S
; Test key: the selected slave runs away now. Debug mode only.
EscapeTestKey=CTRL+SHIFT+E
; Test key: the nearest NPC of another faction knocks out and carries away the target being
; enslaved (or the selected NPC), like a guard taking them to prison. Debug mode only.
CarryTestKey=CTRL+SHIFT+C
; Test key: the selected character falls unconscious. Debug mode only.
KnockoutTestKey=CTRL+SHIFT+K

; 1 - writes details to SlaverMod_trace.log (in this folder) and RE_Kenshi_log.txt.
Debug=0
