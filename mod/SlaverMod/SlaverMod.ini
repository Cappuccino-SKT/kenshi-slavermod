; SlaverMod - escravidão para a facção do jogador.
; Lido ao iniciar o jogo. Com o ModConfigMenu (MCM) ativo, tudo isto também pode ser
; mudado dentro do jogo, em Opções > MCM > SlaverMod, sem reiniciar.

[SlaverMod]

; Nome do esquadrão onde os escravos são colocados (criado se não existir).
SquadName=Escravos

; 1 - mostra a opção Escravizar / Libertar no menu de ordens (selecione um membro seu
; e segure o botão direito sobre o alvo). O membro selecionado vira o dono do escravo.
ContextMenu=1

; 1 - mostra também o botão ESCRAVIZAR / LIBERTAR na janela de inventário.
ShowButton=0

; 1 - escraviza/liberta na hora, sem o dono andar até o alvo (comportamento antigo).
InstantAction=0

; Segundos que o dono passa ao lado do alvo colocando ou tirando os grilhões.
ActionSeconds=4.0

; Segundos para o dono chegar até o alvo antes de desistir.
ApproachTimeout=120

; Quão perto o dono precisa chegar (múltiplo do tamanho dos dois personagens).
ReachFactor=2.5

; 1 - escravo ganha grilhões trancados; ao ser liberto, os grilhões somem.
GiveShackles=1

; Item de grilhão usado (ID do jogo) e alternativa se o primeiro não servir (ex.: colmeia).
ShackleItem=SHACKLES
ShackleItemAlt=SHACKLES-BODY

; Animação do dono enquanto age (a mesma dos primeiros socorros). Vazio = sem animação.
ActionAnimation=medic

; 1 - mostra a barra de progresso sobre o dono enquanto ele age.
ProgressBar=1

; Quanto a relação com a facção da vítima cai ao escravizá-la (0 = nada; relações vão de -100 a 100).
RelationLoss=5.0

; Quanto a relação com a facção de origem sobe ao libertar um escravo. Precisa ser menor
; que RelationLoss (se não for, o mod usa metade de RelationLoss).
; A origem de cada escravo fica guardada em SlaverMod_origins.ini nesta pasta.
RelationGain=2

; ---- Recém-escravizado ----
; 1 - quem acabou de ser escravizado passa a seguir e proteger quem o escravizou.
; Depois disso, o trabalho fica por sua conta, com as ordens normais do jogo.
SlaveEscort=1
; bodyguard = segue e protege; follow = só segue.
EscortMode=bodyguard
; 1 - tira as correntes de quem estava acorrentado ao ser escravizado.
UnchainOnEnslave=1

; 1 - liga o comportamento nativo de "trabalho escravo" do jogo (o mesmo das
; fazendas de escravos). Experimental: pode atrapalhar as suas ordens.
SlaveAIJob=0

; 1 - escravos não podem usar armas: qualquer arma equipada é largada no chão.
BanWeapons=1

; ---- Rebelião ----
; A cada RebellionDays dias de jogo compara as duas forças:
;   livres   = nº de membros livres x maior força entre os livres
;   escravos = nº de escravos       x maior força entre os escravos
; Se os escravos forem mais fortes, a chance de rebelião é
;   (escravos - livres) / escravos x RebellionChanceMult   (no máximo RebellionMaxChance)
; Na rebelião, os escravos com força >= RebelMinStrength viram da facção RebelFaction,
; perdem os grilhões e ganham uma arma ruim (RebelWeapon).
RebellionEnabled=1
RebellionDays=7
RebellionChanceMult=1.00
RebellionMaxChance=0.90
RebelMinStrength=20

; Facção dos rebeldes (padrão: Anti-Escravistas).
RebelFaction=58229-Dialogue.mod

; Arma dos rebeldes (padrão: Porrete de Ferro, o dos bandidos famintos), o fabricante
; que a faz (padrão: "Unknown", o genérico dos bandidos) e o modelo de qualidade
; (padrão: "Rusted Junk", o pior; vazio = o jogo sorteia um modelo do fabricante).
RebelWeapon=52295-rebirth.mod
RebelWeaponMaker=912-gamedata.base
RebelWeaponModel=913-gamedata.base

; 1 - os Anti-Escravistas entram em guerra com você na rebelião (para os rebeldes lutarem).
RebellionHostile=1

; Distância até onde os rebeldes perseguem os seus membros livres para atacar.
RebelChaseRange=1000

; ---- Debug ----
; 1 - liga os atalhos de teste abaixo (EnslaveKey e RebellionTestKey). Com 0 eles não fazem nada.
DebugMode=0

; Tecla que escraviza/liberta o personagem selecionado. Só no modo debug.
; Formatos: K, CTRL+K, SHIFT+ALT+K, F9...
EnslaveKey=CTRL+K

; Tecla de teste: faz a verificação de rebelião na hora, sem esperar os dias. Só no modo debug.
RebellionTestKey=CTRL+SHIFT+R
; 1 - a tecla de teste força a rebelião (ignora a chance). Volte para 0 depois de testar.
RebellionTestForce=0

; 1 - grava os detalhes em SlaverMod_trace.log (nesta pasta) e no RE_Kenshi_log.txt.
Debug=0
