; SlaverMod - what slavers and slaves say (speech bubbles). Turn it off with Speech=0 in SlaverMod.ini.
; [en] is used with Language=en, [pt] with Language=pt. Variants are separated by '|'; one is picked at
; random. A key left out (or this whole file missing) uses the built-in lines, which are the same as below.
; Many lines come from the game's own slavers and slaves.
;
;   EnslaveMaster / EnslaveSlave  - when the shackles go on (the slave only talks if awake)
;   RecaptureMaster               - when a runaway is enslaved again
;   PunishMaster / PunishSlave    - punishment
;   RewardMaster / RewardSlave    - reward
;   FreeMaster                    - when freeing starts
;   FreeSlave / FreeSlaveStays    - freed and leaving / freed and staying in your faction
;   BoughtSlave / SoldSlave       - in the trade window
;   EscapeSlave / EscapeMaster    - a slave runs away / the nearest member shouts
;   RebellionSlave                - rebels when they rise up

[en]
EnslaveMaster=You're mine now.|You'll make a good slave.|Now you work for ME.|You belong to me now.
EnslaveSlave=N- no! Leave me alone!|No, I won't go!|Not the shackles...|No... please...
RecaptureMaster=Thought you could run, huh?|Back in the shackles.|You'll pay for running.
PunishMaster=Bad slave!|Back down, slave!|Disobedient slave!|You'll learn your place.|Stupid slave!
PunishSlave=Ahh!|Please, stop!|I'll obey! I'll obey!|Argh!|Mercy...
RewardMaster=Here. Don't say I never gave you anything.|Good work. Take this.|Keep it up and there's more.
RewardSlave=Thank you, boss...|You lead, I'll follow, boss.|...Thanks.
FreeMaster=Go. You're free.|Get out of here before I change my mind.|You've earned it.
FreeSlave=Freedom!|I never wanna see another cage again!|Guess I owe you.|I'm free...
FreeSlaveStays=I'll stay. You lead, I'll follow, boss.|Where else would I go? I'm staying.|I'll stay with you.
BoughtSlave=Nice meetin' ya, 'boss'...|You buying my freedom? Or you buying ME?|New master, same shackles...
SoldSlave=No! Don't sell me!|You bastard...|Not the cages again...
EscapeSlave=I'm free!|Freedom!|Screw this! I serve no one!|Run for it!
EscapeMaster=Slave! Stop!|A slave is getting away! Stop them!|Slave! You'll be punished for this!
RebellionSlave=Screw this! I serve no one!|Rise up! Break the chains!|Kill the masters!|No more shackles!

[pt]
EnslaveMaster=Agora você é meu.|Você vai dar um bom escravo.|Agora você trabalha pra MIM.|Você me pertence agora.
EnslaveSlave=N- não! Me deixa em paz!|Não, eu não vou!|Os grilhões não...|Não... por favor...
RecaptureMaster=Achou que podia fugir, né?|De volta aos grilhões.|Você vai pagar por ter fugido.
PunishMaster=Escravo ruim!|Abaixa a cabeça, escravo!|Escravo desobediente!|Você vai aprender o seu lugar.|Escravo estúpido!
PunishSlave=Aah!|Por favor, para!|Eu obedeço! Eu obedeço!|Argh!|Piedade...
RewardMaster=Toma. Não diga que eu nunca te dei nada.|Bom trabalho. Pega isso.|Continua assim que tem mais.
RewardSlave=Obrigado, chefe...|Você lidera, eu sigo, chefe.|...Valeu.
FreeMaster=Vai. Você está livre.|Some daqui antes que eu mude de ideia.|Você mereceu.
FreeSlave=Liberdade!|Nunca mais quero ver uma jaula!|Acho que te devo essa.|Estou livre...
FreeSlaveStays=Eu fico. Você lidera, eu sigo, chefe.|Pra onde mais eu iria? Eu fico.|Vou ficar com vocês.
BoughtSlave=Prazer, 'chefe'...|Você comprou minha liberdade? Ou comprou a MIM?|Dono novo, mesmos grilhões...
SoldSlave=Não! Não me vende!|Seu desgraçado...|As jaulas de novo não...
EscapeSlave=Estou livre!|Liberdade!|Chega! Não sirvo a ninguém!|Corre!
EscapeMaster=Escravo! Para!|Um escravo está fugindo! Pega!|Escravo! Você vai ser punido por isso!
RebellionSlave=Chega! Não sirvo a ninguém!|Levantem! Quebrem as correntes!|Matem os donos!|Chega de grilhões!
