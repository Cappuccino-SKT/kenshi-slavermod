; SlaverMod - how each race and subrace takes slavery.
; Read when the game starts (and when ModConfigMenu applies settings). Turn the whole
; table off with RaceTraits=0 in SlaverMod.ini.
;
; One section per race, named by the race's string ID (the log shows it when you
; enslave someone: "race of 'Name': <ID> -> <traits>"). Races not listed use [default].
;   Start  - submission of a new slave of this race (+ SubmissionPrisonerBonus if caged or chained)
;   Cap    - the daily gain does not go above this (-1 = SubmissionGainCap from SlaverMod.ini)
;   Gain   - multiplier on submission gained (time, cage, reward)
;   Loss   - multiplier on submission lost when unwatched
;   Escape - multiplier on the escape chance
;   Punish - multiplier on the submission a punishment gives
; Values left out keep the built-in ones (the same as below).

; Start for [default] comes from SubmissionStart in SlaverMod.ini unless set here.
[default]
Name=Other races
Cap=-1
Gain=1.0
Loss=1.0
Escape=1.0
Punish=1.0

